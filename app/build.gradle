plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

android {
    compileSdk defaultCompileSdkVersion

    defaultConfig {
        applicationId "ru.usedesk.sample"
        minSdk = defaultMinSdkVersion
        targetSdk = defaultTargetSdkVersion
        versionCode = 208
        versionName = project.version
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
    }
    buildFeatures {
        dataBinding = true
    }
    namespace "ru.usedesk.sample"
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                variant.applicationId.map { appId ->
                    "${appId}_v${output.versionName.get()}_c${output.versionCode.get()}.apk".toString()
                }
            )
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation project(":common-sdk")
    implementation project(":common-gui")
    implementation project(":chat-sdk")
    implementation project(":chat-gui")
    implementation project(":knowledgebase-sdk")
    implementation project(":knowledgebase-gui")

    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx

    implementation libs.androidx.activity.ktx
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.appcompat

    implementation libs.google.material

    implementation libs.glide
    implementation(libs.glide.okhttp3.integration) {
        exclude group: "glide-parent"
    }
    ksp libs.glide.ksp

    implementation libs.google.gson

    implementation libs.androidx.multidex
}
