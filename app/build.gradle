plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

android {
    compileSdk = libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId = "ru.usedesk.sample"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = 208
        versionName = project.version
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
        targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    }
    buildFeatures {
        dataBinding = true
    }
    namespace = "ru.usedesk.sample"
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set(
                variant.applicationId.map { appId ->
                    "${appId}_v${output.versionName.get()}_c${output.versionCode.get()}.apk".toString()
                }
            )
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation project(":common-sdk")
    implementation project(":common-gui")
    implementation project(":chat-sdk")
    implementation project(":chat-gui")
    implementation project(":knowledgebase-sdk")
    implementation project(":knowledgebase-gui")

    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui

    implementation libs.androidx.activity
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.appcompat

    implementation libs.google.material

    implementation libs.glide
    implementation(libs.glide.okhttp3.integration) {
        exclude group: "glide-parent"
    }
    ksp libs.glide.ksp

    implementation libs.google.gson
}
